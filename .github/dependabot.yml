# Keeps the build dependencies, the CI actions and the Docker base images
# current. Minor and patch updates arrive grouped in one PR per month.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
